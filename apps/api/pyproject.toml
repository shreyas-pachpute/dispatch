[project]
name = "dispatch"
version = "0.1.0"
description = "An AI operations team for businesses that run on email, PDFs and spreadsheets."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.5",
  "langgraph>=1.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.scripts]
dispatch-api = "dispatch.main:run"
dispatch-demo = "dispatch.demo:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dispatch*"]
